name: flutter_apply_ai
description: "Flutter Apply AI — production desktop app that automates job applications using Gemini and the Gmail API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # ── State management / DI / routing ────────────────────────────────
  get: ^4.7.2

  # ── Networking (Gemini + Gmail REST) ───────────────────────────────
  dio: ^5.9.0

  # ── Local persistence: SQLite (desktop via FFI) ────────────────────
  sqflite_common_ffi: ^2.3.6
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5

  # ── Preferences & secrets ──────────────────────────────────────────
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # ── Functional error handling (Either<Failure, T>) ─────────────────
  dartz: ^0.10.1
  equatable: ^2.0.7

  # ── OAuth2 (desktop loopback + PKCE) ───────────────────────────────
  url_launcher: ^6.3.2
  crypto: ^3.0.6

  # ── Files: resume picking + MIME detection for attachments ─────────
  file_picker: ^8.3.7
  mime: ^2.0.0

  # ── Utilities ──────────────────────────────────────────────────────
  intl: ^0.20.2
  logger: ^2.6.1
  collection: ^1.19.1

  # ── Desktop window management (sizing, min-size, centering) ────────
  window_manager: ^0.5.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/prompts/
